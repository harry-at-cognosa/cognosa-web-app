# /home/ubuntu/cognosa/docker-compose.yml  (copied here by deploy.sh from the git clone)
#
# Layout on the host:
#   /home/ubuntu/cognosa/       ops dir: this file, .env, env_*.env, nginx/, pg_db_data/, qdrantdb/, logs
#   /home/ubuntu/cognosa-src/   git clone of the application repo (build context)
#
# Per-host values live in /home/ubuntu/cognosa/.env (read by compose for ${...}):
#   COGNOSA_DOMAIN=dev.cognosa.net

services:
  # --- PostgreSQL ---
  db:
    image: postgres:17
    restart: always
    env_file:
      - env_db.env
    ports:
      - "5432:5432"
    volumes:
      - ./pg_db_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Qdrant Vector DB ---
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrantdb:/qdrant/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- FastAPI App ---
  app:
    build:
      context: ../cognosa-src
      dockerfile: release/ec2_ubuntu_24_04/cognosa/webapp.Dockerfile
    restart: always
    ports:
      - "8000"
    depends_on:
      - db
      - qdrant
    env_file:
      - env_app.env
    environment:
      - "CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://app:8000,https://${COGNOSA_DOMAIN}"
      - "URL_QDRANT_LOCAL=qdrant:6333"
      - "URL_OLLAMA_LOCAL=http://127.0.0.1:11434/v1"
      - "URL_CHROMA_LOCAL=127.0.0.1:8010"
      - "LOG_SQLALCHEMY_CWA=ERROR"
      - "HF_HOME=/hf_cache"
    volumes:
      - ./app_logs:/app/logs
      - hf_cache:/hf_cache

  # --- Nginx reverse-proxy ---
  nginx:
    image: nginx:stable
    restart: always
    ports:
      - "80:80" # needed for ACME http-01 challenge and redirect to HTTPS
      - "443:443" # HTTPS
    depends_on:
      - app
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - nginx_certs:/etc/letsencrypt # persistent certs
      - nginx_vhost:/var/www/certbot # webroot for certbot challenges
      - ./nginx/log:/var/log/nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Certbot (used to obtain and renew certs) ---
  certbot:
    image: certbot/certbot
    # Not started by `up -d` (profile); used via `docker compose run --rm certbot ...`
    profiles: ["tools"]
    volumes:
      - nginx_certs:/etc/letsencrypt
      - nginx_vhost:/var/www/certbot

  # --- run_tasks ---
  rt:
    build:
      context: ../cognosa-src
      dockerfile: release/ec2_ubuntu_24_04/cognosa/run_tasks.Dockerfile
    restart: always
    depends_on:
      - db
      - qdrant
    env_file:
      - env_run_tasks.env
    environment:
      - "URL_QDRANT_LOCAL=qdrant:6333"
      - "URL_OLLAMA_LOCAL=http://127.0.0.1:11434/v1"
      - "URL_CHROMA_LOCAL=127.0.0.1:8010"
      - "LOG_SQLALCHEMY_RT=ERROR"
      - "RT_VDB_PROCESS_NUM=2"
      - "RT_VDB_EMB_MODELS_PRELOAD=sentence-transformers/all-MiniLM-L6-v2,BAAI/bge-base-en-v1.5"
      - "HF_HOME=/hf_cache"
    volumes:
      - ./rt_logs:/app/logs
      - hf_cache:/hf_cache

volumes:
  nginx_certs:
  nginx_vhost:
  hf_cache:   # Hugging Face model cache shared by app + rt; survives image rebuilds
