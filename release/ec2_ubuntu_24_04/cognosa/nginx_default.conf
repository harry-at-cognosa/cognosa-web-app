server {
    listen 80;
    server_name dev.cognosa.net;

    # Serve ACME challenges from the shared webroot
    location ~ ^/.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dev.cognosa.net;

    ssl_certificate /etc/letsencrypt/live/dev.cognosa.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.cognosa.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # increase client body size if you need uploads
    client_max_body_size 50M;

    # Proxy everything to the FastAPI app (uvicorn)
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://app:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Serve static files for well-known ACME challenges too (just in case)
    location ~ ^/.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
