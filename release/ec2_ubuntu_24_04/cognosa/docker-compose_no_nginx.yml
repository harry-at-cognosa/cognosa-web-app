# /home/ubuntu/cognosa/docker-compose.yml

services:
  # --- PostgreSQL ---
  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - env_db.env
    volumes:
      - ./pg_db_data:/var/lib/postgresql/data

  # --- Qdrant Vector DB ---
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrantdb:/qdrant/storage

  # --- FastAPI App ---
  app:
    build:
      dockerfile: webapp.Dockerfile
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - env_app.env
    environment:
      - "CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://app:8000"
      - "URL_QDRANT_LOCAL=qdrant:6333"
      - "URL_OLLAMA_LOCAL=http://127.0.0.1:11434/v1"
      - "URL_CHROMA_LOCAL=127.0.0.1:8010"

    volumes:
      - ./app_logs:/app/logs

  # --- run_tasks ---
  rt:
    build:
      dockerfile: run_tasks.Dockerfile
    restart: always
    depends_on:
      - db
    env_file:
      - env_run_tasks.env
    environment:
      - "URL_QDRANT_LOCAL=qdrant:6333"
      - "URL_OLLAMA_LOCAL=http://127.0.0.1:11434/v1"
      - "URL_CHROMA_LOCAL=127.0.0.1:8010"

    volumes:
      - ./rt_logs:/app/logs
