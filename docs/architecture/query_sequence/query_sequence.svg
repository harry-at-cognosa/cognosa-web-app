<svg viewBox="0 0 1446 1350" role="img" aria-label="Cognosa query sequence: a user question travels from the React SPA through the FastAPI app into Postgres, is picked up by the rt main loop, embedded and searched in Qdrant by a VDB worker, answered by a streaming LLM worker, and polled back to the SPA" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<line class="life" x1="100" y1="98" x2="100" y2="1250"/>
<rect class="lane spa" x="18" y="40" width="164" height="56" rx="7"/>
<text class="ltitle" x="100" y="62" text-anchor="middle">React SPA</text>
<text class="lsub" x="100" y="78" text-anchor="middle">QueryDocuments page</text>
<line class="life" x1="278" y1="98" x2="278" y2="1250"/>
<rect class="lane app" x="196" y="40" width="164" height="56" rx="7"/>
<text class="ltitle" x="278" y="62" text-anchor="middle">app · FastAPI</text>
<text class="lsub" x="278" y="78" text-anchor="middle">routers/doc_tasks.py</text>
<line class="life" x1="456" y1="98" x2="456" y2="1250"/>
<rect class="lane dat" x="374" y="40" width="164" height="56" rx="7"/>
<text class="ltitle" x="456" y="62" text-anchor="middle">PostgreSQL</text>
<text class="lsub" x="456" y="78" text-anchor="middle">doc_tasks row</text>
<line class="life" x1="634" y1="98" x2="634" y2="1250"/>
<rect class="lane rt" x="552" y="40" width="164" height="56" rx="7"/>
<text class="ltitle" x="634" y="62" text-anchor="middle">rt · main loop</text>
<text class="lsub" x="634" y="78" text-anchor="middle">main_iteration.py · qd_lib/</text>
<line class="life" x1="812" y1="98" x2="812" y2="1250"/>
<rect class="lane rt" x="730" y="40" width="164" height="56" rx="7"/>
<text class="ltitle" x="812" y="62" text-anchor="middle">VDB worker</text>
<text class="lsub" x="812" y="78" text-anchor="middle">vdb_lib · process</text>
<line class="life" x1="990" y1="98" x2="990" y2="1250"/>
<rect class="lane dat" x="908" y="40" width="164" height="56" rx="7"/>
<text class="ltitle" x="990" y="62" text-anchor="middle">Qdrant</text>
<text class="lsub" x="990" y="78" text-anchor="middle">group VDB collection</text>
<line class="life" x1="1168" y1="98" x2="1168" y2="1250"/>
<rect class="lane rt" x="1086" y="40" width="164" height="56" rx="7"/>
<text class="ltitle" x="1168" y="62" text-anchor="middle">LLM worker</text>
<text class="lsub" x="1168" y="78" text-anchor="middle">llm_lib · thread</text>
<line class="life" x1="1346" y1="98" x2="1346" y2="1250"/>
<rect class="lane ext" x="1264" y="40" width="164" height="56" rx="7"/>
<text class="ltitle" x="1346" y="62" text-anchor="middle">LLM</text>
<text class="lsub" x="1346" y="78" text-anchor="middle">Ollama · cloud chat APIs</text>
<rect class="phase " x="20" y="132" width="1406" height="216"/>
<text class="phasename" x="1418" y="146" text-anchor="end">submit + poll</text>
<rect class="phase alt" x="20" y="348" width="1406" height="378"/>
<text class="phasename" x="1418" y="362" text-anchor="end">retrieval</text>
<rect class="phase " x="20" y="726" width="1406" height="432"/>
<text class="phasename" x="1418" y="740" text-anchor="end">generation</text>
<rect class="phase alt" x="20" y="1158" width="1406" height="54"/>
<text class="phasename" x="1418" y="1172" text-anchor="end">deliver</text>
<line class="msg" x1="100" y1="150" x2="278" y2="150" marker-end="url(#arrow)"/>
<text class="mlbl" x="189.0" y="131.0" text-anchor="middle">POST /api/v1/doc_tasks  (JWT)</text>
<text class="mlbl" x="189.0" y="143.0" text-anchor="middle">input_text, gvdbs_id, gllms_id, gc_id</text>
<circle class="badge" cx="112" cy="150" r="9"/>
<text class="badgetext" x="112" y="153.5" text-anchor="middle">1</text>
<line class="msg" x1="278" y1="204" x2="456" y2="204" marker-end="url(#arrow)"/>
<text class="mlbl" x="367.0" y="185.0" text-anchor="middle">INSERT doc_tasks: snapshot group_vdbs,</text>
<text class="mlbl" x="367.0" y="197.0" text-anchor="middle">group_llms rows → gvdbs_json, gllms_json</text>
<circle class="badge" cx="290" cy="204" r="9"/>
<text class="badgetext" x="290" y="207.5" text-anchor="middle">2</text>
<rect class="pill" x="416.5" y="210" width="79" height="16" rx="8"/>
<text class="pilltext" x="456" y="221.5" text-anchor="middle">0 QD_INIT</text>
<line class="msg" x1="278" y1="258" x2="100" y2="258" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text class="mlbl" x="189.0" y="251.0" text-anchor="middle">201 → doc_task uuid</text>
<circle class="badge" cx="266" cy="258" r="9"/>
<text class="badgetext" x="266" y="261.5" text-anchor="middle">3</text>
<line class="msg" x1="100" y1="312" x2="278" y2="312" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text class="mlbl" x="189.0" y="281.0" text-anchor="middle">poll GET /doc_tasks/{uuid} on a timeout loop</text>
<text class="mlbl" x="189.0" y="293.0" text-anchor="middle">→ status, status_text, pct, answer so far</text>
<text class="mlbl" x="189.0" y="305.0" text-anchor="middle">until status in FINISHED_LIST</text>
<circle class="badge" cx="112" cy="312" r="9"/>
<text class="badgetext" x="112" y="315.5" text-anchor="middle">4</text>
<line class="msg" x1="634" y1="366" x2="456" y2="366" marker-end="url(#arrow)"/>
<text class="mlbl" x="545.0" y="335.0" text-anchor="middle">SELECT … WHERE status IN (0, 3)</text>
<text class="mlbl" x="545.0" y="347.0" text-anchor="middle">ORDER BY doc_task_id LIMIT 1</text>
<text class="mlbl" x="545.0" y="359.0" text-anchor="middle">FOR UPDATE SKIP LOCKED</text>
<circle class="badge" cx="622" cy="366" r="9"/>
<text class="badgetext" x="622" y="369.5" text-anchor="middle">5</text>
<path class="msg" d="M634,412 h26 v16 h-20" marker-end="url(#arrow)"/>
<text class="mlbl act" x="668.0" y="401.0" text-anchor="start">qd_init: validate gvdbs_json (url,</text>
<text class="mlbl act" x="668.0" y="413.0" text-anchor="start">collection, emb model, retr filters)</text>
<circle class="badge" cx="646" cy="420" r="9"/>
<text class="badgetext" x="646" y="423.5" text-anchor="middle">6</text>
<rect class="pill" x="388.5" y="426" width="135" height="16" rx="8"/>
<text class="pilltext" x="456" y="437.5" text-anchor="middle">1 QD_INIT_FETCHED</text>
<line class="msg" x1="634" y1="474" x2="812" y2="474" marker-end="url(#arrow)"/>
<text class="mlbl" x="723.0" y="455.0" text-anchor="middle">Queue.put(VDBDocTaskQueueMsg)</text>
<text class="mlbl" x="723.0" y="467.0" text-anchor="middle">multiprocessing queue</text>
<circle class="badge" cx="646" cy="474" r="9"/>
<text class="badgetext" x="646" y="477.5" text-anchor="middle">7</text>
<rect class="pill" x="392.0" y="480" width="128" height="16" rx="8"/>
<text class="pilltext" x="456" y="491.5" text-anchor="middle">2 QD_VDB_PENDING</text>
<path class="msg" d="M812,520 h26 v16 h-20" marker-end="url(#arrow)"/>
<text class="mlbl act" x="846.0" y="509.0" text-anchor="start">embed question: HuggingFaceEmbeddings</text>
<text class="mlbl act" x="846.0" y="521.0" text-anchor="start">(gvdbs_emb_model, preloaded)</text>
<circle class="badge" cx="824" cy="528" r="9"/>
<text class="badgetext" x="824" y="531.5" text-anchor="middle">8</text>
<line class="msg" x1="812" y1="582" x2="990" y2="582" marker-end="url(#arrow)"/>
<text class="mlbl" x="901.0" y="563.0" text-anchor="middle">as_retriever(search_type, k …)</text>
<text class="mlbl" x="901.0" y="575.0" text-anchor="middle">+ payload filter from retr_filters</text>
<circle class="badge" cx="824" cy="582" r="9"/>
<text class="badgetext" x="824" y="585.5" text-anchor="middle">9</text>
<line class="msg" x1="990" y1="636" x2="812" y2="636" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text class="mlbl" x="901.0" y="629.0" text-anchor="middle">top-k chunks + metadata</text>
<circle class="badge" cx="978" cy="636" r="9"/>
<text class="badgetext" x="978" y="639.5" text-anchor="middle">10</text>
<line class="msg" x1="812" y1="690" x2="456" y2="690" marker-end="url(#arrow)"/>
<text class="mlbl" x="634.0" y="671.0" text-anchor="middle">UPDATE context_json (found docs,</text>
<text class="mlbl" x="634.0" y="683.0" text-anchor="middle">deduped), vdb_query_seconds</text>
<circle class="badge" cx="800" cy="690" r="9"/>
<text class="badgetext" x="800" y="693.5" text-anchor="middle">11</text>
<rect class="pill" x="392.0" y="696" width="128" height="16" rx="8"/>
<text class="pilltext" x="456" y="707.5" text-anchor="middle">3 QD_VDB_FETCHED</text>
<line class="msg" x1="634" y1="744" x2="456" y2="744" marker-end="url(#arrow)"/>
<text class="mlbl" x="545.0" y="725.0" text-anchor="middle">next poll picks status 3 →</text>
<text class="mlbl" x="545.0" y="737.0" text-anchor="middle">qd_vdb_fetched</text>
<circle class="badge" cx="622" cy="744" r="9"/>
<text class="badgetext" x="622" y="747.5" text-anchor="middle">12</text>
<rect class="pill" x="392.0" y="750" width="128" height="16" rx="8"/>
<text class="pilltext" x="456" y="761.5" text-anchor="middle">4 QD_LLM_PENDING</text>
<line class="msg" x1="634" y1="798" x2="1168" y2="798" marker-end="url(#arrow)"/>
<text class="mlbl" x="901.0" y="791.0" text-anchor="middle">start LLMWorker(Thread)(doc_task_id)</text>
<circle class="badge" cx="646" cy="798" r="9"/>
<text class="badgetext" x="646" y="801.5" text-anchor="middle">13</text>
<line class="msg" x1="1168" y1="852" x2="456" y2="852" marker-end="url(#arrow)"/>
<text class="mlbl" x="812.0" y="833.0" text-anchor="middle">read task, gllms_json,</text>
<text class="mlbl" x="812.0" y="845.0" text-anchor="middle">group_contexts template</text>
<circle class="badge" cx="1156" cy="852" r="9"/>
<text class="badgetext" x="1156" y="855.5" text-anchor="middle">14</text>
<path class="msg" d="M1168,898 h-26 v16 h20" marker-end="url(#arrow)"/>
<text class="mlbl act" x="1134.0" y="875.0" text-anchor="end">prepare_context: "Document i: …"</text>
<text class="mlbl act" x="1134.0" y="887.0" text-anchor="end">chain = {context, question} | prompt</text>
<text class="mlbl act" x="1134.0" y="899.0" text-anchor="end">        | ChatModel | StrOutputParser</text>
<circle class="badge" cx="1156" cy="906" r="9"/>
<text class="badgetext" x="1156" y="909.5" text-anchor="middle">15</text>
<line class="msg" x1="1168" y1="960" x2="1346" y2="960" marker-end="url(#arrow)"/>
<text class="mlbl" x="1257.0" y="929.0" text-anchor="middle">chain.stream(question)</text>
<text class="mlbl" x="1257.0" y="941.0" text-anchor="middle">ChatOpenAI · ChatAnthropic ·</text>
<text class="mlbl" x="1257.0" y="953.0" text-anchor="middle">ChatGoogleGenerativeAI</text>
<circle class="badge" cx="1180" cy="960" r="9"/>
<text class="badgetext" x="1180" y="963.5" text-anchor="middle">16</text>
<line class="msg" x1="1346" y1="1014" x2="1168" y2="1014" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text class="mlbl" x="1257.0" y="1007.0" text-anchor="middle">token chunks, streamed</text>
<circle class="badge" cx="1334" cy="1014" r="9"/>
<text class="badgetext" x="1334" y="1017.5" text-anchor="middle">17</text>
<line class="msg" x1="1168" y1="1068" x2="456" y2="1068" marker-end="url(#arrow)"/>
<text class="mlbl" x="812.0" y="1049.0" text-anchor="middle">write sent_to_llm; append answer</text>
<text class="mlbl" x="812.0" y="1061.0" text-anchor="middle">per chunk</text>
<circle class="badge" cx="1156" cy="1068" r="9"/>
<text class="badgetext" x="1156" y="1071.5" text-anchor="middle">18</text>
<rect class="pill" x="392.0" y="1074" width="128" height="16" rx="8"/>
<text class="pilltext" x="456" y="1085.5" text-anchor="middle">5 QD_LLM_WRITING</text>
<line class="msg" x1="1168" y1="1122" x2="456" y2="1122" marker-end="url(#arrow)"/>
<text class="mlbl" x="812.0" y="1115.0" text-anchor="middle">final answer, llm_query_seconds</text>
<circle class="badge" cx="1156" cy="1122" r="9"/>
<text class="badgetext" x="1156" y="1125.5" text-anchor="middle">19</text>
<rect class="pill" x="392.0" y="1128" width="128" height="16" rx="8"/>
<text class="pilltext" x="456" y="1139.5" text-anchor="middle">6 QD_LLM_FETCHED</text>
<line class="msg" x1="278" y1="1176" x2="100" y2="1176" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text class="mlbl" x="189.0" y="1157.0" text-anchor="middle">poll returns status 6: answer (markdown)</text>
<text class="mlbl" x="189.0" y="1169.0" text-anchor="middle">+ sources from context_json; stop polling</text>
<circle class="badge" cx="266" cy="1176" r="9"/>
<text class="badgetext" x="266" y="1179.5" text-anchor="middle">20</text>
<text class="note" x="20" y="1264">Errors: each stage writes its own negative status and a status_text: -1 QD_INIT_ERROR, -3 QD_VDB_ERROR, -6 QD_LLM_ERROR. The SPA stops polling on any of them.</text>
<text class="note" x="20" y="1280">No-retrieval mode: a task with gvdbs_id = -1 skips steps 6 to 11; the main loop moves it from status 0 straight to 3 and it goes to the LLM with an empty context.</text>
<text class="note" x="20" y="1296">Concurrency: FOR UPDATE SKIP LOCKED lets several rt instances share one doc_tasks table; VDB workers are RT_VDB_PROCESS_NUM processes; each task gets its own LLM thread.</text>
</svg>