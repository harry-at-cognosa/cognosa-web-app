<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      label::after {
        background-color: #ffffff00 !important;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="d-flex justify-content-center align-items-center min-vh-100 container"
      >
        <div style="max-width: 400px; width: 100%" class="shadow-lg p-4 card">
          <h2 class="text-center mb-4">Login</h2>
          <form id="loginForm" class="">
            <div class="form-floating mb-3">
              <input
                type="text"
                class="form-control"
                id="floatingEmail"
                placeholder="name@example.com"
              />
              <label for="floatingEmail">Username or Email</label>
            </div>
            <div class="mb-3 input-group">
              <div class="form-floating">
                <input
                  placeholder="Password"
                  required=""
                  id="floatingPassword"
                  class="form-control"
                  type="password"
                /><label for="floatingPassword">Password</label>
              </div>
              <button
                type="button"
                id="togglePassword"
                class="btn btn-outline-secondary"
              >
                <svg
                  id="iconInvisible"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 16 16"
                  width="18"
                  height="18"
                  fill="currentColor"
                  class="bi bi-eye-fill"
                >
                  <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"></path>
                  <path
                    d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"
                  ></path>
                </svg>
                <svg
                  id="iconVisible"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 16 16"
                  width="18"
                  height="18"
                  fill="currentColor"
                  class="bi bi-eye-slash-fill"
                  style="display: none"
                >
                  <path
                    d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"
                  ></path>
                  <path
                    d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"
                  ></path>
                </svg>
              </button>
            </div>
            <div id="errorBox" class="text-danger mb-3"></div>
            <button type="submit" class="w-100 py-2 fw-bold btn btn-primary">
              LOGIN
            </button>
          </form>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "/api/v1";

      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("floatingEmail");
      const passwordInput = document.getElementById("floatingPassword");
      const errorBox = document.getElementById("errorBox");

      const togglePassword = document.getElementById("togglePassword");
      const iconVisible = document.getElementById("iconVisible");
      const iconInvisible = document.getElementById("iconInvisible");

      // Show/Hide password
      togglePassword.addEventListener("click", () => {
        const isShown = passwordInput.type === "text";
        passwordInput.type = isShown ? "password" : "text";
        if (isShown) {
          iconVisible.style.display = "none";
          iconInvisible.style.display = "";
        } else {
          iconVisible.style.display = "";
          iconInvisible.style.display = "none";
        }
      });

      // Submit handler
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("d-none");
        errorBox.textContent = "";

        const username = emailInput.value.trim();
        const password = passwordInput.value.trim();

        const body = new URLSearchParams();
        body.append("username", username);
        body.append("password", password);

        // Choose login path
        const apiPath = "/auth/jwt/login";

        try {
          const res = await fetch(`${API_URL}${apiPath}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: body.toString(),
          });

          if (res.ok) {
            const data = await res.json();
            localStorage.setItem("token", data.access_token);

            // Redirect
            window.location.replace("/app");
          } else {
            errorBox.textContent = "Invalid login";
            errorBox.classList.remove("d-none");
          }
        } catch (err) {
          errorBox.textContent = "Network error";
          errorBox.classList.remove("d-none");
        }
      });
    </script>
  </body>
</html>
