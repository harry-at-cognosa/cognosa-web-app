<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Same colour scheme as the app (chosen in its user menu); light by default.
      try {
        var s = localStorage.getItem("webapp_color_scheme");
        var dark =
          s === "dark" ||
          (s === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.scheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <style>
      /* Look of the app (direction 9b, src/index.css) without its build: the
         instance colour is not known before login, so the accent is the neutral
         grey ramp, and the fonts are the system's. */
      :root {
        --ink: #171c28;
        --ink-2: #3b4354;
        --muted-fg: #535c6e;
        --line: rgba(23, 28, 40, 0.12);
        --line-soft: rgba(23, 28, 40, 0.07);
        --canvas: #fcfdff;
        --wash-a: #e5e7eb;
        --wash-b: #f3f4f6;
        --companion: #ffe1cc;
        --card: rgba(255, 255, 255, 0.93);
        --card-edge: rgba(255, 255, 255, 0.95);
        --surface: #ffffff;
        --edge: #9ca3af;
        --ring: #374151;
        --glow: rgba(107, 114, 128, 0.3);
        --fill: linear-gradient(120deg, #374151, #1f2937);
        --fill-fg: #ffffff;
        --sheen: inset 0 1px 0 rgba(255, 255, 255, 0.28);
        --err: #a81e33;
      }
      [data-scheme="dark"] {
        color-scheme: dark;
        --ink: #eef1f7;
        --ink-2: #cfd5e1;
        --muted-fg: #a6afc0;
        --line: rgba(255, 255, 255, 0.14);
        --line-soft: rgba(255, 255, 255, 0.08);
        --canvas: #0c1019;
        --wash-a: rgba(75, 85, 99, 0.34);
        --wash-b: rgba(31, 41, 55, 0.5);
        --companion: rgba(190, 96, 44, 0.3);
        --card: rgba(22, 27, 41, 0.86);
        --card-edge: rgba(255, 255, 255, 0.1);
        --surface: rgba(255, 255, 255, 0.06);
        --edge: rgba(156, 163, 175, 0.6);
        --ring: #d1d5db;
        --glow: rgba(107, 114, 128, 0.26);
        --fill: linear-gradient(120deg, #d1d5db, #9ca3af);
        --fill-fg: #0d111c;
        --sheen: inset 0 1px 0 rgba(255, 255, 255, 0.4);
        --err: #ff9aa9;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--canvas);
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.45;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(820px 480px at 4% -8%, var(--wash-a), transparent 68%),
          radial-gradient(620px 460px at 78% -12%, var(--wash-b), transparent 70%),
          radial-gradient(760px 560px at 104% 96%, var(--companion), transparent 66%),
          radial-gradient(700px 520px at 30% 112%, var(--wash-b), transparent 70%),
          var(--canvas);
        background-attachment: fixed;
      }
      .login-wrap {
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        padding: 28px 26px 26px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid var(--card-edge);
        box-shadow:
          0 0 0 1px var(--line-soft),
          0 26px 56px -34px var(--glow);
      }
      .login-card h2 {
        margin: 0 0 22px;
        text-align: center;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.15;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        margin: 0 0 5px 2px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.2;
        color: var(--muted-fg);
      }
      .field-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .field-row > .grow {
        flex: 1;
        min-width: 0;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        height: 40px;
        padding: 4px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input::placeholder {
        color: transparent;
      }
      input:hover {
        border-color: var(--edge);
      }
      input:focus-visible {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px var(--glow);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      #togglePassword {
        flex: none;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-2);
      }
      #togglePassword:hover {
        border-color: var(--edge);
      }
      #errorBox {
        min-height: 20px;
        margin-bottom: 14px;
        color: var(--err);
        font-weight: 500;
      }
      .d-none {
        display: none;
      }
      button[type="submit"] {
        width: 100%;
        height: 42px;
        border: 0;
        border-radius: 999px;
        background: var(--fill);
        color: var(--fill-fg);
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        box-shadow:
          0 12px 24px -10px var(--glow),
          var(--sheen);
      }
      button[type="submit"]:hover {
        filter: brightness(1.1);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="login-wrap">
        <div class="login-card">
          <h2>Login</h2>
          <form id="loginForm">
            <div class="field">
              <label for="floatingEmail">Username or Email</label>
              <input
                type="text"
                id="floatingEmail"
                placeholder="name@example.com"
              />
            </div>
            <div class="field">
              <label for="floatingPassword">Password</label>
              <div class="field-row">
                <div class="grow">
                  <input
                    placeholder="Password"
                    required=""
                    id="floatingPassword"
                    type="password"
                  />
                </div>
                <button
                  type="button"
                  id="togglePassword"
                  aria-label="Show or hide password"
                >
                  <svg
                    id="iconInvisible"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 16 16"
                    width="18"
                    height="18"
                    fill="currentColor"
                  >
                    <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"></path>
                    <path
                      d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"
                    ></path>
                  </svg>
                  <svg
                    id="iconVisible"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 16 16"
                    width="18"
                    height="18"
                    fill="currentColor"
                    style="display: none"
                  >
                    <path
                      d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"
                    ></path>
                    <path
                      d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"
                    ></path>
                  </svg>
                </button>
              </div>
            </div>
            <div id="errorBox"></div>
            <button type="submit">LOGIN</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "/api/v1";

      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("floatingEmail");
      const passwordInput = document.getElementById("floatingPassword");
      const errorBox = document.getElementById("errorBox");

      const togglePassword = document.getElementById("togglePassword");
      const iconVisible = document.getElementById("iconVisible");
      const iconInvisible = document.getElementById("iconInvisible");

      // Show/Hide password
      togglePassword.addEventListener("click", () => {
        const isShown = passwordInput.type === "text";
        passwordInput.type = isShown ? "password" : "text";
        if (isShown) {
          iconVisible.style.display = "none";
          iconInvisible.style.display = "";
        } else {
          iconVisible.style.display = "";
          iconInvisible.style.display = "none";
        }
      });

      // Submit handler
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("d-none");
        errorBox.textContent = "";

        const username = emailInput.value.trim();
        const password = passwordInput.value.trim();

        const body = new URLSearchParams();
        body.append("username", username);
        body.append("password", password);

        // Choose login path
        const apiPath = "/auth/jwt/login";

        try {
          const res = await fetch(`${API_URL}${apiPath}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: body.toString(),
          });

          if (res.ok) {
            const data = await res.json();
            localStorage.setItem("token", data.access_token);

            // Redirect
            window.location.replace("/app");
          } else {
            errorBox.textContent = "Invalid login";
            errorBox.classList.remove("d-none");
          }
        } catch (err) {
          errorBox.textContent = "Network error";
          errorBox.classList.remove("d-none");
        }
      });
    </script>
  </body>
</html>
