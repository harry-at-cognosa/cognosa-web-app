<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/app/favicon.ico" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cognosa WebApp</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .spinner {
        width: 60px;
        height: 60px;
        border: 5px solid #f0f0f0;
        border-top-color: #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <script>
    (async function () {
      const token = localStorage.getItem("token");
      // no token → go to login
      if (!token) {
        window.location.href = "/login";
        return;
      }
      try {
        const headers = { Authorization: "Bearer " + token };
        // 1. Check token using /auth/me
        const meRes = await fetch("/api/v1/users/me", { headers });

        if (!meRes.ok) throw new Error("Invalid token");
        const redirectUrl = "/app";
        // 2. Token valid → request protected /app
        const appRes = await fetch(redirectUrl, { headers });

        if (!appRes.ok) throw new Error("Unauthorized");

        // Replace current document with returned HTML
        const html = await appRes.text();
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        localStorage.removeItem("token");
        console.error("Auth failed:", err);
        window.location.replace("/login");
      }
    })();
  </script>
  <body>
    <div class="spinner"></div>
  </body>
</html>
