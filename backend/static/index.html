<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/app/favicon.ico" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cognosa WebApp</title>
    <script>
      // Colour scheme chosen in the user menu (src/lib/scheme.ts), applied before
      // first paint so the preloader and the page do not flash the other scheme.
      try {
        var s = localStorage.getItem("webapp_color_scheme");
        var dark =
          s === "dark" ||
          (s === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.scheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <style>
      /* same canvas colours as src/index.css (--canvas) */
      html {
        background-color: #fcfdff;
      }
      html[data-scheme="dark"] {
        background-color: #0c1019;
      }
      #preloaded-spinner-outer {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #preloaded-spinner {
        width: 60px;
        height: 60px;
        border: 5px solid rgba(128, 136, 152, 0.22);
        border-top-color: #6b7280;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="/app/assets/index-CJG-HcCX.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/highlight.js-DbXFfZe5.js">
    <link rel="modulepreload" crossorigin href="/app/assets/vendor-Dr8kZIXD.js">
    <link rel="modulepreload" crossorigin href="/app/assets/xlsx-XtQG98H8.js">
    <link rel="stylesheet" crossorigin href="/app/assets/highlight-Dfs9RUU9.css">
    <link rel="stylesheet" crossorigin href="/app/assets/index-CWSKoePM.css">
  </head>
  <body>
    <div id="root">
      <div id="preloaded-spinner-outer">
        <div id="preloaded-spinner"></div>
      </div>
    </div>
  </body>
</html>
